name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.327.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MEF_WSDLS_S3_BUCKET: ${{ secrets.MEF_WSDLS_S3_BUCKET }}

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libyaml-dev pkg-config

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.327.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # Not cached: fork PRs can read the base branch's Actions caches, and the WSDLs aren't redistributable.
      # Without secrets (forks, Dependabot) the download is skipped and the conformance specs skip.
      - name: Assume MeF WSDLs role
        if: env.MEF_WSDLS_S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.MEF_WSDLS_AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 900

      - name: Download MeF WSDLs
        if: env.MEF_WSDLS_S3_BUCKET != ''
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bundle exec ruby script/download_mef_wsdls.rb

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bin/rails db:test:prepare spec
